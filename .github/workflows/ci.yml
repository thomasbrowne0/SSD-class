name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

      # SCA gate: fail if any NuGet dependency (incl. transitive) has a known vulnerability.
      - name: SCA - vulnerable dependencies
        run: |
          dotnet list package --vulnerable --include-transitive | tee sca.txt
          if grep -q "has the following vulnerable packages" sca.txt; then exit 1; fi

  # SAST gate: Semgrep's C# rules on the source code. Fails on any finding.
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/csharp --error --metrics=off --exclude tests

  # DAST gate: ZAP baseline scan of the running app (unauthenticated pages).
  # Fails on any warning not explained in .zap/rules.tsv.
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start app, database and Keycloak
        run: |
          docker compose up -d --build --wait
          timeout 120 bash -c 'until curl -sf http://localhost:5000/Report > /dev/null; do sleep 2; done'
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://localhost:5000/Report -c rules.tsv -r zap-report.html
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap/zap-report.html

  # W45: build the image, generate its SBOM, scan it, and only push if every gate passed.
  build-and-push:
    needs: [test, sast, dast]
    # Only publish images from main, not from pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vulntracker:ci

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: vulntracker:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      # Fails on high/critical vulnerabilities that have a fix available.
      - name: Scan SBOM (Grype)
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
